<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats Web Player</title>

    <!-- YouTube Engine API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #0f0f12;
            color: #fff; 
            padding: 20px 10px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo { 
            font-size: 28px; 
            font-weight: 900; 
            color: #ff2a5f; 
            margin-bottom: 24px;
            margin-top: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #ff2a5f;
            color: #fff;
            border-color: #ff2a5f;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .category-title { 
            font-size: 12px; 
            text-transform: uppercase; 
            color: #ff2a5f; 
            margin-bottom: 12px; 
            font-weight: 800;
            letter-spacing: 1px;
        }

        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        
        .cd-art { 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            border: 2px solid #ff2a5f; 
            object-fit: cover; 
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .cd-art.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .song-info { flex: 1; margin: 0 14px; overflow: hidden; }
        .song-title { font-size: 16px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 13px; color: #aaa; margin-top: 2px; }

        .seekbar-row { margin: 15px 0 10px 0; }
        .seekbar {
            width: 100%;
            height: 5px;
            accent-color: #ff2a5f;
            cursor: pointer;
            border-radius: 5px;
        }

        .controls-row { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: rgba(0,0,0,0.4); 
            padding: 10px; 
            border-radius: 14px; 
            margin-top: 10px;
        }
        
        .btn { background: none; border: none; cursor: pointer; color: #fff; font-size: 20px; }
        .play-btn { 
            background: #ffffff; 
            color: #000;
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 18px;
        }

        #yt-player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="logo">MY-BEATS</div>

    <!-- Category Switcher Tabs -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('bollywood')">Bollywood</button>
        <button class="tab-btn" onclick="switchCategory('punjabi')">Punjabi</button>
        <button class="tab-btn" onclick="switchCategory('lofi')">Chill / Lo-Fi</button>
    </div>

    <!-- YouTube Engine Element -->
    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Player Card -->
    <div class="card">
        <div class="category-title" id="cat-title">Bollywood Hits</div>
        <div class="top-row">
            <img src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" class="cd-art" id="cd-art">
            <div class="song-info">
                <div class="song-title" id="song-title">Loading...</div>
                <div class="artist-name" id="artist-name">---</div>
            </div>
        </div>
        <div class="seekbar-row">
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
        </div>
        <div class="controls-row">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <script>
        // Playlist Data organized by Category
        const musicData = {
            bollywood: [
                { id: "6mr4cYJ7yew", title: "Kesariya", artist: "Arijit Singh" },
                { id: "VAdGW7QDJiU", title: "Chaleya", artist: "Anirudh Ravichander" },
                { id: "UEvOsQBu1jY", title: "Apna Bana Le", artist: "Arijit Singh" }
            ],
            punjabi: [
                { id: "cl0a3i2wFcc", title: "Softly", artist: "Karan Aujla" },
                { id: "2h0L112l1W0", title: "Checking With You", artist: "Karan Aujla" },
                { id: "vX2cDW8LUWk", title: "Elevated", artist: "Shubh" }
            ],
            lofi: [
                { id: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio", artist: "Lofi Girl" },
                { id: "5qap5aO4i9A", title: "Lofi Sleep Beats", artist: "ChillHop" }
            ]
        };

        let currentCategory = "bollywood";
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;

        function updateUI() {
            const song = musicData[currentCategory][currentIndex];
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('artist-name').innerText = song.artist;
            document.getElementById('cat-title').innerText = currentCategory.toUpperCase() + " HITS";
        }

        function switchCategory(cat) {
            if (currentCategory === cat) return;
            currentCategory = cat;
            currentIndex = 0;
            
            // Update active tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            updateUI();
            if (ytPlayer && isPlaying) {
                ytPlayer.loadVideoById(musicData[currentCategory][currentIndex].id);
            }
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                            document.getElementById('cd-art').classList.add('playing');
                        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            document.getElementById('cd-art').classList.remove('playing');
                            if (event.data === YT.PlayerState.ENDED) nextSong();
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if (!ytPlayer) return alert("Player initialising, please wait a second...");
            const song = musicData[currentCategory][currentIndex];
            
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                if (ytPlayer.getVideoData && ytPlayer.getVideoData().video_id === song.id) {
                    ytPlayer.playVideo();
                } else {
                    ytPlayer.loadVideoById(song.id);
                }
            }
        }

        function nextSong() {
            const catSongs = musicData[currentCategory];
            currentIndex = (currentIndex + 1) % catSongs.length;
            updateUI();
            if (ytPlayer && isPlaying) {
                ytPlayer.loadVideoById(catSongs[currentIndex].id);
            }
        }

        function prevSong() {
            const catSongs = musicData[currentCategory];
            currentIndex = (currentIndex - 1 + catSongs.length) % catSongs.length;
            updateUI();
            if (ytPlayer && isPlaying) {
                ytPlayer.loadVideoById(catSongs[currentIndex].id);
            }
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                }
            }
        }, 500);

        // Run UI update immediately on page load
        updateUI();
    </script>
</body>
</html>
