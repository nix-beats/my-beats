<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats - T-Series Special</title>

    <!-- T-Series Bollywood Songs Script -->
    <script src="bollywood.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            padding: 20px 10px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .logo { 
            font-size: 28px; 
            font-weight: 900; 
            color: #ffffff; 
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Category Tabs (Sad / Romantic) Top of Track Box */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 340px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        /* Transparent Track Box with White Outline */
        .card {
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px solid #ffffff;
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .category-title { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #ffffff; 
            margin-bottom: 12px; 
            font-weight: 800;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }

        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        
        .cd-art { 
            width: 58px; 
            height: 58px; 
            border-radius: 50%; 
            border: 2px solid #ffffff; 
            object-fit: cover; 
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .cd-art.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-info { flex: 1; margin: 0 14px; overflow: hidden; }
        .song-title { font-size: 16px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 13px; color: rgba(255, 255, 255, 0.8); margin-top: 2px; }

        .seekbar-row { margin: 15px 0 12px 0; }
        .seekbar {
            width: 100%;
            height: 4px;
            accent-color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
        }

        .controls-row { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px; 
            border-radius: 14px; 
        }
        
        .btn { background: none; border: none; cursor: pointer; color: #ffffff; font-size: 20px; }
        .play-btn { 
            background: #ffffff; 
            color: #000000;
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 16px;
        }

        #yt-player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="logo">MY-BEATS</div>

    <!-- Category Selector Tabs -->
    <div class="category-tabs">
        <button class="tab-btn active" id="tab-romantic" onclick="switchCategory('romantic')">❤️ ROMANTIC</button>
        <button class="tab-btn" id="tab-sad" onclick="switchCategory('sad')">💔 SAD</button>
    </div>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Track Card Box -->
    <div class="card">
        <div class="category-title" id="playlist-tag">T-SERIES ROMANTIC</div>
        <div class="top-row">
            <img src="bollywood.cd.jpg" class="cd-art" id="cd-art">
            <div class="song-info">
                <div class="song-title" id="song-title">Loading...</div>
                <div class="artist-name" id="artist-name">---</div>
            </div>
        </div>
        <div class="seekbar-row">
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
        </div>
        <div class="controls-row">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <script>
        let currentCategory = 'romantic';
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;
        let isEngineReady = false;

        function getSongs() {
            if (window.bollywoodSongs && window.bollywoodSongs.length > 0) {
                return window.bollywoodSongs.filter(song => song.category === currentCategory);
            }
            return [];
        }

        function switchCategory(category) {
            if (currentCategory === category) return;
            currentCategory = category;
            currentIndex = 0;

            // Update UI Tabs
            document.getElementById('tab-romantic').classList.toggle('active', category === 'romantic');
            document.getElementById('tab-sad').classList.toggle('active', category === 'sad');
            document.getElementById('playlist-tag').innerText = 'T-SERIES ' + category.toUpperCase();

            updateUI();

            if (isPlaying) {
                playCurrentSong();
            }
        }

        function updateUI() {
            const list = getSongs();
            if (list.length > 0) {
                const song = list[currentIndex];
                document.getElementById('song-title').innerText = song.title;
                document.getElementById('artist-name').innerText = song.artist;
            }
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onReady': function() {
                        isEngineReady = true;
                    },
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                            document.getElementById('cd-art').classList.add('playing');
                        } else if (event.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            document.getElementById('cd-art').classList.remove('playing');
                        } else if (event.data === YT.PlayerState.ENDED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            document.getElementById('cd-art').classList.remove('playing');
                            nextSong();
                        }
                    },
                    'onError': function(event) {
                        isPlaying = false;
                        document.getElementById('play-btn').innerText = '▶';
                        document.getElementById('cd-art').classList.remove('playing');
                    }
                }
            });
        }

        function playCurrentSong() {
            const list = getSongs();
            if (list.length === 0) return;
            const song = list[currentIndex];
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(song.id);
                ytPlayer.playVideo();
            }
        }

        function togglePlay() {
            if (!isEngineReady || !ytPlayer) return;

            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                playCurrentSong();
            }
        }

        function nextSong() {
            const list = getSongs();
            if (list.length === 0) return;
            currentIndex = (currentIndex + 1) % list.length;
            updateUI();
            if (isPlaying) playCurrentSong();
        }

        function prevSong() {
            const list = getSongs();
            if (list.length === 0) return;
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            updateUI();
            if (isPlaying) playCurrentSong();
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                }
            }
        }, 500);

        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
