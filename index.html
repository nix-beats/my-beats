<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats Web Player</title>

    <!-- गानों की एक्सटर्नल फाइल्स -->
    <script src="bollywood.js"></script>
    <script src="sadhabhar.js"></script>

    <!-- YouTube Engine API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            /* आपकी रिपोजिटरी की bg.jpg इमेज */
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            padding: 20px 10px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .logo { 
            font-size: 28px; 
            font-weight: 900; 
            color: #ffffff; 
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Transparent Track Box with White Outline */
        .card {
            background: transparent;
            border: 1.5px solid #ffffff;
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .category-title { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #ffffff; 
            margin-bottom: 12px; 
            font-weight: 800;
            letter-spacing: 1.5px;
            opacity: 0.8;
        }

        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        
        /* Rotating CD */
        .cd-art { 
            width: 58px; 
            height: 58px; 
            border-radius: 50%; 
            border: 2px solid #ffffff; 
            object-fit: cover; 
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .cd-art.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .song-info { flex: 1; margin: 0 14px; overflow: hidden; }
        .song-title { font-size: 16px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 13px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }

        .seekbar-row { margin: 15px 0 12px 0; }
        .seekbar {
            width: 100%;
            height: 4px;
            accent-color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
        }

        .controls-row { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px; 
            border-radius: 14px; 
        }
        
        .btn { background: none; border: none; cursor: pointer; color: #ffffff; font-size: 20px; }
        .play-btn { 
            background: #ffffff; 
            color: #000000;
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 16px;
        }

        #yt-player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="logo">MY-BEATS</div>

    <!-- 2 Main Categories -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('bollywood', this)">Bollywood Pop</button>
        <button class="tab-btn" onclick="switchCategory('sadhabhar', this)">Sada Bahar</button>
    </div>

    <!-- YouTube Hidden Engine -->
    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Transparent Player Box -->
    <div class="card">
        <div class="category-title" id="cat-title">BOLLYWOOD POP</div>
        <div class="top-row">
            <img src="bollywood.cd.jpg" class="cd-art" id="cd-art">
            <div class="song-info">
                <div class="song-title" id="song-title">Loading...</div>
                <div class="artist-name" id="artist-name">---</div>
            </div>
        </div>
        <div class="seekbar-row">
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
        </div>
        <div class="controls-row">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <script>
        // Default songs fallback if external JS isn't loaded yet
        const defaultBollywood = [
            { id: "6mr4cYJ7yew", title: "Kesariya", artist: "Arijit Singh" },
            { id: "VAdGW7QDJiU", title: "Chaleya", artist: "Anirudh Ravichander" }
        ];

        const defaultSadhabhar = [
            { id: "284T-ae8_wU", title: "Lag Ja Gale", artist: "Lata Mangeshkar" },
            { id: "g0eO74UmxEs", title: "Pal Pal Dil Ke Paas", artist: "Kishore Kumar" }
        ];

        let currentCategory = "bollywood";
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;

        function getSongs() {
            if (currentCategory === "bollywood") {
                return (window.bollywoodSongs && window.bollywoodSongs.length > 0) ? window.bollywoodSongs : defaultBollywood;
            } else {
                return (window.sadhabharSongs && window.sadhabharSongs.length > 0) ? window.sadhabharSongs : defaultSadhabhar;
            }
        }

        function updateUI() {
            const songsList = getSongs();
            const song = songsList[currentIndex];
            
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('artist-name').innerText = song.artist;
            document.getElementById('cat-title').innerText = currentCategory === 'bollywood' ? 'BOLLYWOOD POP' : 'SADA BAHAR';
            
            // CD Image Changing
            const cdArt = document.getElementById('cd-art');
            if (currentCategory === 'bollywood') {
                cdArt.src = "bollywood.cd.jpg";
            } else {
                cdArt.src = "sadhabhar.cd.jpg";
            }
        }

        function switchCategory(cat, btnElem) {
            if (currentCategory === cat) return;
            currentCategory = cat;
            currentIndex = 0;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElem.classList.add('active');

            updateUI();
            if (ytPlayer && isPlaying) {
                ytPlayer.loadVideoById(getSongs()[currentIndex].id);
            }
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                            document.getElementById('cd-art').classList.add('playing');
                        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            document.getElementById('cd-art').classList.remove('playing');
                            if (event.data === YT.PlayerState.ENDED) nextSong();
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if (!ytPlayer) return alert("Please wait, player loading...");
            const song = getSongs()[currentIndex];
            
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                if (ytPlayer.getVideoData && ytPlayer.getVideoData().video_id === song.id) {
                    ytPlayer.playVideo();
                } else {
                    ytPlayer.loadVideoById(song.id);
                }
            }
        }

        function nextSong() {
            const list = getSongs();
            currentIndex = (currentIndex + 1) % list.length;
            updateUI();
            if (ytPlayer && isPlaying) {
                ytPlayer.loadVideoById(list[currentIndex].id);
            }
        }

        function prevSong() {
            const list = getSongs();
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            updateUI();
            if (ytPlayer && isPlaying) {
                ytPlayer.loadVideoById(list[currentIndex].id);
            }
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                }
            }
        }, 500);

        // Run UI update immediately
        updateUI();
    </script>
</body>
</html>
