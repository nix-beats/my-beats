<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats</title>

    <!-- YouTube Engine API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff; 
            padding: 15px; 
            min-height: 100vh;
        }
        
        .logo { 
            text-align: center; 
            margin-bottom: 18px; 
            color: #ffffff; 
            font-size: 24px;
            letter-spacing: 3px; 
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            max-width: 580px;
            margin: 0 auto;
        }

        .card {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 14px 12px;
            min-height: 165px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .category-title { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #ff2a5f; 
            margin-bottom: 6px; 
            font-weight: 800; 
            letter-spacing: 1px;
        }

        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        
        .cd-art { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            border: 2px solid #ff2a5f; 
            object-fit: cover; 
            animation: rotate 10s linear infinite; 
            animation-play-state: paused; 
        }
        .cd-art.playing { animation-play-state: running; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .song-info { flex: 1; margin: 0 10px; overflow: hidden; }
        .song-title { font-size: 13px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .artist-name { font-size: 10.5px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .heart-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .heart-btn svg { width: 20px; height: 20px; fill: none; stroke: #ffffff; stroke-width: 2.2; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8)); }
        .heart-btn.liked svg { fill: #ff2a5f; stroke: #ff2a5f; }

        .seekbar-row { display: flex; align-items: center; margin: 6px 0; }
        .seekbar {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        .seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff2a5f;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }

        .controls-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.35); 
            padding: 6px 10px; 
            border-radius: 10px; 
        }
        
        .btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .btn svg { width: 15px; height: 15px; fill: #ffffff; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8)); }

        .play-btn { 
            background: #ffffff; 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .play-btn svg { fill: #000; width: 13px; height: 13px; filter: none; }

        #yt-player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -999;
        }
    </style>
</head>

    <script>
        // Directly Embedded Music Database
        const musicData = {
            bollywood: [
                { id: "6mr4cYJ7yew", title: "Kesariya", artist: "Arijit Singh" },
                { id: "VAdGW7QDJiU", title: "Chaleya", artist: "Anirudh Ravichander" },
                { id: "UEvOsQBu1jY", title: "Apna Bana Le", artist: "Arijit Singh" }
            ],
            sadabahar: [
                { id: "vS3_72h9-jg", title: "Tere Bina Zindagi Se", artist: "Lata Mangeshkar" },
                { id: "85y1xP8bJ50", title: "Lag Ja Gale", artist: "Lata Mangeshkar" }
            ],
            retro: [
                { id: "1m-H7-1Vn1A", title: "Tamma Tamma Loge", artist: "Bappi Lahiri" },
                { id: "h1hV6l3T5wE", title: "Disco Dancer", artist: "Vijay Benedict" }
            ]
        };

        const currentTracks = {};
        let activeCategory = null;
        let ytPlayer = null;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (activeCategory) setPlayIcon(activeCategory, true);
            } else if (event.data === YT.PlayerState.PAUSED) {
                if (activeCategory) setPlayIcon(activeCategory, false);
            } else if (event.data === YT.PlayerState.ENDED) {
                if (activeCategory) nextSong(activeCategory);
            }
        }

        function updateCardUI(cat) {
            const card = document.getElementById(`card-${cat}`);
            if (card && currentTracks[cat]) {
                card.querySelector('.song-title').innerText = currentTracks[cat].title;
                card.querySelector('.artist-name').innerText = currentTracks[cat].artist;
            }
        }

        function initApp() {
            ['bollywood', 'sadabahar', 'retro'].forEach(cat => {
                if (musicData[cat] && musicData[cat].length > 0) {
                    const randIndex = Math.floor(Math.random() * musicData[cat].length);
                    currentTracks[cat] = { index: randIndex, ...musicData[cat][randIndex] };
                    updateCardUI(cat);
                }
            });
            loadFavUI();
        }

        setInterval(() => {
            if (activeCategory && ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                    const duration = ytPlayer.getDuration();
                    const currentTime = ytPlayer.getCurrentTime();
                    if (duration > 0) {
                        const percent = (currentTime / duration) * 100;
                        const seekbar = document.getElementById(`seek-${activeCategory}`);
                        if (seekbar) seekbar.value = percent || 0;
                    }
                }
            }
        }, 500);

        function seekAudio(cat, val) {
            if (activeCategory === cat && ytPlayer && typeof ytPlayer.seekTo === 'function') {
                const duration = ytPlayer.getDuration();
                if (duration > 0) {
                    ytPlayer.seekTo((val / 100) * duration, true);
                }
            }
        }

        function togglePlay(cat) {
            if (cat === 'fav') {
                const favs = JSON.parse(localStorage.getItem('myBeatsFavs') || '[]');
                if (favs.length === 0) return alert('No favorite songs added!');
                if (!currentTracks['fav']) currentTracks['fav'] = favs[0];
            }

            const song = currentTracks[cat];
            if (!song) return;

            if (activeCategory === cat) {
                if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                    const state = ytPlayer.getPlayerState();
                    if (state === YT.PlayerState.PLAYING) {
                        ytPlayer.pauseVideo();
                    } else {
                        ytPlayer.playVideo();
                    }
                }
            } else {
                if (activeCategory) {
                    setPlayIcon(activeCategory, false);
                    const oldSeek = document.getElementById(`seek-${activeCategory}`);
                    if (oldSeek) oldSeek.value = 0;
                }
                activeCategory = cat;
                if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                    ytPlayer.loadVideoById(song.id);
                }
                updateCardUI(cat);
            }
        }

        function setPlayIcon(cat, isPlaying) {
            const card = document.getElementById(`card-${cat}`);
            if (!card) return;
            const playSvg = card.querySelector('.play-btn');
            const cd = card.querySelector('.cd-art');
            
            if (isPlaying) {
                playSvg.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                cd.classList.add('playing');
            } else {
                playSvg.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                cd.classList.remove('playing');
            }
        }

        function shuffleSong(cat) {
            if (cat === 'fav') return;
            const randIndex = Math.floor(Math.random() * musicData[cat].length);
            currentTracks[cat] = { index: randIndex, ...musicData[cat][randIndex] };
            updateCardUI(cat);
            if (activeCategory === cat && ytPlayer) {
                ytPlayer.loadVideoById(currentTracks[cat].id);
            }
        }

        function nextSong(cat) {
            if (cat === 'fav') return;
            currentTracks[cat].index = (currentTracks[cat].index + 1) % musicData[cat].length;
            const song = musicData[cat][currentTracks[cat].index];
            currentTracks[cat] = { index: currentTracks[cat].index, ...song };
            updateCardUI(cat);
            if (activeCategory === cat && ytPlayer) {
                ytPlayer.loadVideoById(song.id);
            }
        }

        function prevSong(cat) {
            if (cat === 'fav') return;
            currentTracks[cat].index = (currentTracks[cat].index - 1 + musicData[cat].length) % musicData[cat].length;
            const song = musicData[cat][currentTracks[cat].index];
            currentTracks[cat] = { index: currentTracks[cat].index, ...song };
            updateCardUI(cat);
            if (activeCategory === cat && ytPlayer) {
                ytPlayer.loadVideoById(song.id);
            }
        }

        function toggleFav(cat) {
            const song = currentTracks[cat];
            if (!song) return
