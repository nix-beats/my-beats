<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify - My Beats</title>

    <script src="songs.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Prevent entire page scrolling */
        html, body { 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #000000; 
            color: #ffffff; 
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #121212;
            position: relative;
        }

        /* Top Header & Search */
        .header {
            padding: 12px 16px 8px 16px;
            background: #121212;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: #1DB954;
            letter-spacing: -0.5px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #242424;
            border-radius: 8px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-box input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            width: 100%;
        }

        .search-box input::placeholder { color: #b3b3b3; }

        /* Category Scroll Chips */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 16px 12px 16px;
            scrollbar-width: none;
            background: #121212;
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .chip {
            background: #232323;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip.active {
            background: #1DB954;
            color: #000000;
        }

        /* Internal Song List (Scrollable Area) */
        .song-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 120px 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #b3b3b3;
            margin: 12px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .track-item:active, .track-item.playing {
            background: #282828;
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .track-number {
            font-size: 13px;
            color: #b3b3b3;
            width: 16px;
            text-align: center;
        }

        .track-meta { overflow: hidden; }
        .track-name { 
            font-size: 14px; 
            font-weight: 600; 
            color: #ffffff; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .track-item.playing .track-name { color: #1DB954; }

        .track-artist { 
            font-size: 12px; 
            color: #b3b3b3; 
            margin-top: 2px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .play-icon-small {
            color: #1DB954;
            font-size: 14px;
        }

        /* Pinned Spotify Bottom Player */
        .bottom-player {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 10px 16px 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-track-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .player-art {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            object-fit: cover;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .player-art.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .player-details { overflow: hidden; }
        .player-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-sub { font-size: 11px; color: #b3b3b3; }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 16px;
            cursor: pointer;
        }
        .ctrl-btn:active { color: #fff; }

        .main-play-btn {
            background: #1DB954;
            color: #000;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        .seekbar-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seekbar {
            flex: 1;
            height: 3px;
            accent-color: #1DB954;
            cursor: pointer;
        }

        .time-text {
            font-size: 10px;
            color: #b3b3b3;
            font-weight: 600;
            width: 28px;
        }

        #yt-player-container { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Header -->
        <div class="header">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-.1.2-1.38-.42-.18-.6.42-1.2 1.02-1.38C9.12 6.18 16.2 6.42 20.58 9.06c.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/></svg>
                My Beats
            </div>
            <div class="search-box">
                <span style="color:#b3b3b3; font-size: 12px;">🔍</span>
                <input type="text" id="searchInput" placeholder="Search songs or artists..." oninput="renderTracks()">
            </div>
        </div>

        <!-- Horizontal Category Pills -->
        <div class="category-scroll">
            <button class="chip active" onclick="filterCategory('all', this)">All</button>
            <button class="chip" onclick="filterCategory('bollywood_romantic', this)">Bollywood ❤️</button>
            <button class="chip" onclick="filterCategory('bollywood_sad', this)">Bollywood 💔</button>
            <button class="chip" onclick="filterCategory('nineties_romantic', this)">90s ❤️</button>
            <button class="chip" onclick="filterCategory('nineties_sad', this)">90s 💔</button>
            <button class="chip" onclick="filterCategory('sadabahar_romantic', this)">Retro ❤️</button>
            <button class="chip" onclick="filterCategory('sadabahar_sad', this)">Retro 💔</button>
            <button class="chip" onclick="filterCategory('punjabi_romantic', this)">Punjabi ❤️</button>
            <button class="chip" onclick="filterCategory('punjabi_sad', this)">Punjabi 💔</button>
        </div>

        <!-- Scrollable Song List -->
        <div class="song-list-container">
            <div class="section-title" id="currentCategoryLabel">All Songs</div>
            <div id="trackList"></div>
        </div>

        <!-- Spotify Style Bottom Player -->
        <div class="bottom-player">
            <div class="player-row">
                <div class="player-track-info">
                    <img src="cd.jpg" id="cd-art" class="player-art" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg'">
                    <div class="player-details">
                        <div class="player-title" id="song-title">Select a Song</div>
                        <div class="player-sub" id="artist-name">Spotify Music</div>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn" onclick="prevSong()">⏮</button>
                    <button class="main-play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                    <button class="ctrl-btn" onclick="nextSong()">⏭</button>
                </div>
            </div>
            <div class="seekbar-container">
                <span class="time-text" id="curr-time">0:00</span>
                <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
                <span class="time-text" id="dur-time" style="text-align: right;">0:00</span>
            </div>
        </div>

    </div>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        let currentFilter = 'all';
        let displayList = [];
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;
        let isEngineReady = false;

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function getAllSongs() {
            let all = [];
            if (!window.musicData) return all;
            for (let key in window.musicData) {
                const songs = window.musicData[key].filter(s => s.id && s.id !== "...id...");
                songs.forEach(s => all.push({ ...s, categoryKey: key }));
            }
            return all;
        }

        function filterCategory(catKey, btnElem) {
            currentFilter = catKey;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            if (btnElem) btnElem.classList.add('active');

            const labelMap = {
                'all': 'All Songs',
                'bollywood_romantic': 'Bollywood Romantic',
                'bollywood_sad': 'Bollywood Sad',
                'nineties_romantic': '90s Romantic',
                'nineties_sad': '90s Sad',
                'sadabahar_romantic': 'Retro Romantic',
                'sadabahar_sad': 'Retro Sad',
                'punjabi_romantic': 'Punjabi Romantic',
                'punjabi_sad': 'Punjabi Sad'
            };
            document.getElementById('currentCategoryLabel').innerText = labelMap[catKey] || 'Playlist';
            renderTracks();
        }

        function renderTracks() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('trackList');
            container.innerHTML = '';

            let rawList = [];
            if (currentFilter === 'all') {
                rawList = getAllSongs();
            } else if (window.musicData && window.musicData[currentFilter]) {
                rawList = window.musicData[currentFilter].filter(s => s.id && s.id !== "...id...");
            }

            displayList = rawList.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.artist.toLowerCase().includes(query)
            );

            if (displayList.length === 0) {
                container.innerHTML = `<div style="color:#b3b3b3; font-size:13px; text-align:center; padding:30px 0;">No songs found</div>`;
                return;
            }

            displayList.forEach((song, idx) => {
                const isCurrent = isPlaying && currentSong && currentSong.id === song.id;
                const div = document.createElement('div');
                div.className = `track-item ${isCurrent ? 'playing' : ''}`;
                div.innerHTML = `
                    <div class="track-left">
                        <span class="track-number">${idx + 1}</span>
                        <div class="track-meta">
                            <div class="track-name">${song.title}</div>
                            <div class="track-artist">${song.artist}</div>
                        </div>
                    </div>
                    ${isCurrent ? '<span class="play-icon-small">♫</span>' : ''}
                `;
                div.onclick = () => playSelectedTrack(idx);
                container.appendChild(div);
            });
        }

        let currentSong = null;

        function playSelectedTrack(idx) {
            if (displayList.length === 0) return;
            currentIndex = idx;
            currentSong = displayList[currentIndex];

            document.getElementById('song-title').innerText = currentSong.title;
            document.getElementById('artist-name').innerText = currentSong.artist;

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(currentSong.id);
                ytPlayer.playVideo();
            }
            renderTracks();
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100', width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onReady': () => { isEngineReady = true; },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                            document.getElementById('cd-art').classList.add('playing');
                            renderTracks();
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            document.getElementById('cd-art').classList.remove('playing');
                            renderTracks();
                        } else if (e.data === YT.PlayerState.ENDED) {
                            nextSong();
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if (!isEngineReady || !ytPlayer) return;
            if (!currentSong && displayList.length > 0) {
                playSelectedTrack(0);
                return;
            }
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { ytPlayer.playVideo(); }
        }

        function nextSong() {
            if (displayList.length === 0) return;
            currentIndex = (currentIndex + 1) % displayList.length;
            playSelectedTrack(currentIndex);
        }

        function prevSong() {
            if (displayList.length === 0) return;
            currentIndex = (currentIndex - 1 + displayList.length) % displayList.length;
            playSelectedTrack(currentIndex);
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                    document.getElementById('curr-time').innerText = formatTime(cur);
                    document.getElementById('dur-time').innerText = formatTime(dur);
                }
            }
        }, 500);

        window.onload = function() {
            renderTracks();
        };
    </script>
</body>
</html>
