<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Store</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Disable text/media selection & long press callout */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Hacker Vibe Header */
        header {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #00ff41;
            display: inline-block;
        }

        .brand-name span {
            color: #008000;
        }

        /* Main Video Card Container */
        .product-card {
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            background-color: #fafafa;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* Video Wrapper with Blur Mask Overlay */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #000000;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Blur Overlay Mask */
        .video-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* Container for Eye Button & Text */
        .mask-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Eye Button */
        .eye-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: #000000;
            color: #00ff41;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            transition: transform 0.2s ease;
        }

        .eye-btn svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #00ff41;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .video-mask:hover .eye-btn {
            transform: scale(1.1);
        }

        /* "see content" Subtext */
        .btn-subtext {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: lowercase;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Caption & Black Buy Button */
        .product-caption {
            font-size: 16px;
            color: #333333;
            margin-bottom: 20px;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }

        .buy-btn {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            border: 1px solid #000000;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .buy-btn:hover {
            background-color: #222222;
            color: #00ff41;
        }

        /* Footer / Site Description */
        footer {
            margin-top: 50px;
            padding: 25px 20px;
            border-top: 2px dashed #000000;
            text-align: center;
            background-color: #f4f4f4;
            border-radius: 8px;
        }

        .site-desc {
            font-size: 14px;
            color: #555555;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- Header Section (Left Top Hacker Vibe Logo) -->
    <header>
        <div class="brand-name">>_ DARK STORE<span>_</span></div>
    </header>

    <!-- Main Content: Single Video Product -->
    <main>
        <div class="product-card">
            
            <!-- Video Container with Blur Mask -->
            <div class="video-wrapper">
                <!-- Video with Download Restrictions -->
                <video id="myVideo" controls controlsList="nodownload" disablePictureInPicture oncontextmenu="return false;" preload="metadata">
                    <source src="product.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                
                <!-- Blur Mask Overlay with Eye Button and "see content" -->
                <div class="video-mask" id="videoMask" onclick="playVideo()">
                    <div class="mask-content">
                        <div class="eye-btn">
                            <!-- Eye SVG Icon -->
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                        <span class="btn-subtext">see content</span>
                    </div>
                </div>
            </div>

            <!-- Product Caption Placeholder -->
            <p class="product-caption">2000+ Dark Web , Red Rooms Vidios only in 299₹  
Click on Buy button</p>

            <!-- Black Buy Button with Link Placeholder -->
            <a href="http://t.me/Dark_web_rooms_bot" class="buy-btn">Buy Now</a>

        </div>
    </main>

    <!-- Footer Section (Site Description Placeholder) -->
    <footer>
        <p class="site-desc">.....site-description.....</p>
    </footer>

    <!-- Scripts -->
    <script>
        // Play video and remove blur mask
        function playVideo() {
            var video = document.getElementById('myVideo');
            var mask = document.getElementById('videoMask');
            
            mask.style.display = 'none'; // Blur Mask Hata do
            video.play();               // Video Play kar do
        }

        // Disable right click / long press context menu globally and on video
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
