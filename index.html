<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Store</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Section */
        header {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 13px;
            color: #000000;
            font-weight: bold;
            letter-spacing: 0.5px;
            font-family: Arial, sans-serif;
        }

        /* Main Video Card Container */
        .product-card {
            border: 2px solid #000000;
            padding: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Video Box */
        .video-wrapper {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #000000;
            border: 1px solid #000000;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Caption Text */
        .product-caption {
            display: block !important;
            font-size: 18px !important;
            font-weight: bold !important;
            color: #000000 !important;
            margin: 20px 0 !important;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }

        /* Full Width Black Button */
        a.buy-btn, 
        a.buy-btn:visited, 
        a.buy-btn:link {
            display: block !important;
            width: 100% !important;
            background-color: #000000 !important;
            color: #ffffff !important;
            padding: 16px 0 !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 18px !important;
            border-radius: 6px !important;
            font-family: Arial, sans-serif !important;
            border: 2px solid #000000 !important;
            text-align: center !important;
            box-sizing: border-box !important;
        }

        a.buy-btn:hover {
            background-color: #333333 !important;
        }

        /* Footer / Description Box */
        footer {
            margin-top: 50px;
            padding: 25px 20px;
            border: 2px solid #000000;
            text-align: center;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .site-desc {
            font-size: 14px;
            color: #000000;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="brand-name">DARK STORE</div>
        <div class="tagline">(Wait 10 second video is loding)</div>
    </header>

    <!-- Main Content: Single Video Product -->
    <main>
        <div class="product-card">
            
            <!-- Video Box -->
            <div class="video-wrapper">
                <video id="myVideo" controls controlsList="nodownload" disablePictureInPicture oncontextmenu="return false;" preload="metadata">
                    <source src="product.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Product Caption Placeholder -->
            <p class="product-caption">Teligram Group Avilable Price Is Very Low 💥 </p>

            <!-- Black Join Group Button (With Updated Telegram Custom Message Link) -->
            <a href="https://t.me/+r0zUPIsB5hIyMDhl" class="buy-btn" target="_blank">Join Group</a>

        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p class="site-desc">Download First Teligram, After Joi Dark Web Services Leaked Video's Group</p>
    </footer>

    <!-- Scripts -->
    <script>
        // Disable Right Click / Long Press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
