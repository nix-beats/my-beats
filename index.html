<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Store</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Hacker Vibe Header */
        header {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #00ff41;
            display: inline-block;
        }

        .brand-name span {
            color: #008000;
        }

        /* Main Video Card Container */
        .product-card {
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            background-color: #fafafa;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* Video Wrapper with Blur Mask Overlay */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #000000;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Blur Overlay Mask */
        .video-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* Alert / Play Button (!) */
        .alert-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: #000000;
            color: #00ff41;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            user-select: none;
            transition: transform 0.2s ease;
        }

        .video-mask:hover .alert-btn {
            transform: scale(1.1);
        }

        /* Caption & Black Buy Button */
        .product-caption {
            font-size: 16px;
            color: #333333;
            margin-bottom: 20px;
            line-height: 1.5;
            font-family: Arial, sans-serif;
        }

        .buy-btn {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            border: 1px solid #000000;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .buy-btn:hover {
            background-color: #222222;
            color: #00ff41;
        }

        /* Footer / Site Description */
        footer {
            margin-top: 50px;
            padding: 25px 20px;
            border-top: 2px dashed #000000;
            text-align: center;
            background-color: #f4f4f4;
            border-radius: 8px;
        }

        .site-desc {
            font-size: 14px;
            color: #555555;
            line-height: 1.6;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">>_ DARK STORE<span>_</span></div>
    </header>

    <main>
        <div class="product-card">
            
            <div class="video-wrapper">
                <video id="myVideo" controls preload="metadata">
                    <source src="product.vid" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                
                <div class="video-mask" id="videoMask" onclick="playVideo()">
                    <div class="alert-btn">!</div>
                </div>
            </div>

            <p class="product-caption">.....caption.....</p>

            <a href="......buy-link......" class="buy-btn">Buy Now</a>

        </div>
    </main>

    <footer>
        <p class="site-desc">.....site-description.....</p>
    </footer>

    <script>
        function playVideo() {
            var video = document.getElementById('myVideo');
            var mask = document.getElementById('videoMask');
            
            mask.style.display = 'none'; // Blur Mask Hata do
            video.play();               // Video Play kar do
        }
    </script>

</body>
</html>
