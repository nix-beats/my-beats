<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Beats - Riter Dashboard UI</title>

    <script src="songs.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Strict No Page Scroll */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #08090c;
            color: #e2e4e9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Dashboard Container */
        .sidebar-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #0d0e14;
            border: 1px solid #1c1e29;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* macOS Window Dots & Header */
        .mac-header {
            padding: 16px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mac-dots {
            display: flex;
            gap: 6px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: #252836;
            border: 1px solid #32364a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-size: 14px;
        }

        .brand-text h1 { font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: 0.3px; }
        .brand-text p { font-size: 11px; color: #62687b; margin-top: 1px; }

        /* Sleek Search Box with ⌘K Badge */
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin: 4px 0 6px 0;
        }

        .search-wrapper input {
            width: 100%;
            background: #141620;
            border: 1px solid #202333;
            border-radius: 8px;
            padding: 9px 36px 9px 34px;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border 0.2s;
        }
        .search-wrapper input:focus { border-color: #3f4563; }
        .search-wrapper input::placeholder { color: #52586d; }

        .search-icon { position: absolute; left: 12px; color: #52586d; font-size: 12px; }
        .kbd-badge {
            position: absolute;
            right: 10px;
            background: #1c1f2e;
            border: 1px solid #2a2e45;
            color: #6a7189;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Main Content List Area (Scrollable internally) */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 130px 16px;
        }
        .content-area::-webkit-scrollbar { display: none; }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: #4b5165;
            margin: 14px 0 8px 6px;
            letter-spacing: 0.5px;
        }

        /* Nav & Category Rows */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            color: #939ab1;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.15s ease;
        }
        .nav-item:hover { background: #141620; color: #fff; }
        .nav-item.active {
            background: #1b1e2c;
            color: #ffffff;
            font-weight: 600;
            border: 1px solid #282d42;
        }

        .nav-left { display: flex; align-items: center; gap: 10px; }
        .nav-icon { font-size: 14px; opacity: 0.7; width: 16px; text-align: center; }

        .count-badge {
            background: #181b28;
            border: 1px solid #252a3e;
            color: #6c748e;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
        }

        /* Track List Item (Riter Style) */
        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .track-item:hover { background: #12141d; }
        .track-item.playing {
            background: #191c2b;
            border: 1px solid #262b40;
        }
        .track-item.playing .track-title { color: #60a5fa; }

        .track-meta { overflow: hidden; margin-left: 8px; }
        .track-title { font-size: 12px; font-weight: 600; color: #d0d4e4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-sub { font-size: 10px; color: #585f76; margin-top: 1px; }

        /* Pinned Bottom User/Player Box (Image Matching) */
        .bottom-player-card {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: #13151f;
            border: 1px solid #222636;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .player-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #292e42;
        }

        .player-text { overflow: hidden; }
        .player-title-str { font-size: 12px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist-str { font-size: 10px; color: #687087; }

        .player-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            background: none;
            border: none;
            color: #8c94ac;
            font-size: 13px;
            cursor: pointer;
            padding: 4px;
        }
        .btn-action:hover { color: #fff; }

        .play-main-btn {
            background: #ffffff;
            color: #0d0e14;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Progress Bar */
        .progress-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seekbar {
            flex: 1;
            height: 3px;
            accent-color: #ffffff;
            cursor: pointer;
            background: #202434;
            border-radius: 2px;
        }

        .time-str {
            font-size: 9px;
            color: #5c637a;
            font-weight: 600;
            width: 24px;
        }

        #yt-player-container { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div class="sidebar-container">
        
        <!-- Header & Window Controls -->
        <div class="mac-header">
            <div class="mac-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>

            <div class="brand-box">
                <div class="brand-logo">🎵</div>
                <div class="brand-text">
                    <h1>My Beats™</h1>
                    <p>Music Workspace</p>
                </div>
            </div>

            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search.." oninput="renderTracks()">
                <span class="kbd-badge">⌘K</span>
            </div>
        </div>

        <!-- Scrollable Dashboard Content -->
        <div class="content-area">
            
            <div class="section-label">General</div>
            <div class="nav-item active" id="cat-all" onclick="filterCategory('all', this)">
                <div class="nav-left">
                    <span class="nav-icon">⊞</span>
                    <span>Overview (All)</span>
                </div>
            </div>
            <div class="nav-item" id="cat-fav" onclick="filterCategory('bollywood_romantic', this)">
                <div class="nav-left">
                    <span class="nav-icon">❤️</span>
                    <span>Bollywood Romantic</span>
                </div>
            </div>
            <div class="nav-item" onclick="filterCategory('bollywood_sad', this)">
                <div class="nav-left">
                    <span class="nav-icon">💔</span>
                    <span>Bollywood Sad</span>
                </div>
            </div>

            <div class="section-label">Categories</div>
            <div class="nav-item" onclick="filterCategory('nineties_romantic', this)">
                <div class="nav-left">
                    <span class="nav-icon">📻</span>
                    <span>90's Romantic</span>
                </div>
            </div>
            <div class="nav-item" onclick="filterCategory('sadabahar_romantic', this)">
                <div class="nav-left">
                    <span class="nav-icon">🎙️</span>
                    <span>Retro Sada Bahar</span>
                </div>
            </div>
            <div class="nav-item" onclick="filterCategory('punjabi_romantic', this)">
                <div class="nav-left">
                    <span class="nav-icon">🚗</span>
                    <span>Punjabi Long Drive</span>
                </div>
            </div>

            <div class="section-label">Tracks</div>
            <div id="trackListContainer"></div>

        </div>

        <!-- Pinned Bottom User / Player Card (Riter Style) -->
        <div class="bottom-player-card">
            <div class="player-top">
                <div class="player-info">
                    <img src="cd.jpg" class="player-thumb" id="cd-art" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg'">
                    <div class="player-text">
                        <div class="player-title-str" id="song-title">Select a Song</div>
                        <div class="player-artist-str" id="artist-name">Music Player</div>
                    </div>
                </div>
                <div class="player-btns">
                    <button class="btn-action" onclick="prevSong()">⏮</button>
                    <button class="play-main-btn" id="play-btn" onclick="togglePlay()">▶</button>
                    <button class="btn-action" onclick="nextSong()">⏭</button>
                </div>
            </div>

            <div class="progress-box">
                <span class="time-str" id="curr-time">0:00</span>
                <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
                <span class="time-str" id="dur-time" style="text-align: right;">0:00</span>
            </div>
        </div>

    </div>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        let currentFilter = 'all';
        let displayList = [];
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;
        let isEngineReady = false;

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function getAllSongs() {
            let all = [];
            if (!window.musicData) return all;
            for (let key in window.musicData) {
                const songs = window.musicData[key].filter(s => s.id && s.id !== "...id...");
                songs.forEach(s => all.push({ ...s, categoryKey: key }));
            }
            return all;
        }

        function filterCategory(catKey, elem) {
            currentFilter = catKey;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (elem) elem.classList.add('active');
            renderTracks();
        }

        function renderTracks() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('trackListContainer');
            container.innerHTML = '';

            let rawList = [];
            if (currentFilter === 'all') {
                rawList = getAllSongs();
            } else if (window.musicData && window.musicData[currentFilter]) {
                rawList = window.musicData[currentFilter].filter(s => s.id && s.id !== "...id...");
            }

            displayList = rawList.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.artist.toLowerCase().includes(query)
            );

            if (displayList.length === 0) {
                container.innerHTML = `<div style="color:#4b5165; font-size:11px; text-align:center; padding:15px 0;">No songs found</div>`;
                return;
            }

            displayList.forEach((song, idx) => {
                const isCurrent = isPlaying && currentSong && currentSong.id === song.id;
                const div = document.createElement('div');
                div.className = `track-item ${isCurrent ? 'playing' : ''}`;
                div.innerHTML = `
                    <div style="display:flex; align-items:center; overflow:hidden;">
                        <span style="font-size:10px; color:#4b5165; width:12px;">└</span>
                        <div class="track-meta">
                            <div class="track-title">${song.title}</div>
                            <div class="track-sub">${song.artist}</div>
                        </div>
                    </div>
                    <span style="font-size:10px; color:${isCurrent ? '#60a5fa' : '#3c4257'};">▶</span>
                `;
                div.onclick = () => playSelectedTrack(idx);
                container.appendChild(div);
            });
        }

        let currentSong = null;

        function playSelectedTrack(idx) {
            if (displayList.length === 0) return;
            currentIndex = idx;
            currentSong = displayList[currentIndex];

            document.getElementById('song-title').innerText = currentSong.title;
            document.getElementById('artist-name').innerText = currentSong.artist;

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(currentSong.id);
                ytPlayer.playVideo();
            }
            renderTracks();
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100', width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onReady': () => { isEngineReady = true; },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                            renderTracks();
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            renderTracks();
                        } else if (e.data === YT.PlayerState.ENDED) {
                            nextSong();
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if (!isEngineReady || !ytPlayer) return;
            if (!currentSong && displayList.length > 0) {
                playSelectedTrack(0);
                return;
            }
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { ytPlayer.playVideo(); }
        }

        function nextSong() {
            if (displayList.length === 0) return;
            currentIndex = (currentIndex + 1) % displayList.length;
            playSelectedTrack(currentIndex);
        }

        function prevSong() {
            if (displayList.length === 0) return;
            currentIndex = (currentIndex - 1 + displayList.length) % displayList.length;
            playSelectedTrack(currentIndex);
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                    document.getElementById('curr-time').innerText = formatTime(cur);
                    document.getElementById('dur-time').innerText = formatTime(dur);
                }
            }
        }, 500);

        window.onload = function() {
            renderTracks();
        };
    </script>
</body>
</html>
