<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 - Glass Player UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090a0f url('bg.jpg') no-repeat center center/cover;
            overflow: hidden;
        }

        /* 25% Visible, 75% Blur Glass Box */
        .glass-player-box {
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid #ffffff;
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Track Info Row */
        .track-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        .song-details {
            text-align: center;
        }

        .song-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .artist-name {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }

        /* Seekbar & Time Row */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-text {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            min-width: 38px;
        }

        .seekbar {
            flex: 1;
            height: 4px;
            appearance: none;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .seekbar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        /* Controls Row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0 2px 0;
        }

        .play-btn-main {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #e91e63;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.1s;
        }

        .play-btn-main:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="glass-player-box">
        
        <!-- Top Row: Heart, Title, Plus -->
        <div class="track-info-row">
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
            <div class="song-details">
                <div class="song-title">Track Name</div>
                <div class="artist-name">Artist Name</div>
            </div>
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </div>

        <!-- Progress Seekbar Row -->
        <div class="progress-container">
            <span class="time-text">00:29</span>
            <input type="range" class="seekbar" value="25" min="0" max="100">
            <span class="time-text" style="text-align: right;">04:40</span>
        </div>

        <!-- Main Media Controls Row -->
        <div class="controls-row">
            <!-- Rewind 10s -->
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 2v6h6"></path><path d="M2.66 15.57a10 10 0 1 0 .57-8.38L2.5 8"></path><text x="9" y="15" font-size="7" fill="#ffffff" font-weight="bold">10</text></svg>
            </button>

            <!-- Shuffle -->
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>

            <!-- Previous Track -->
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
            </button>

            <!-- Play / Pause Center Button -->
            <button class="play-btn-main">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            </button>

            <!-- Next Track -->
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
            </button>

            <!-- Repeat -->
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>

            <!-- Forward 10s -->
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"></path><path d="M21.34 15.57a10 10 0 1 1-.57-8.38L21.5 8"></path><text x="9" y="15" font-size="7" fill="#ffffff" font-weight="bold">10</text></svg>
            </button>
        </div>

    </div>

</body>
</html>
