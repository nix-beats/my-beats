<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glassmorphism Audio Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            background: #0d0f17 url('bg.jpg') no-repeat center center/cover;
            overflow: hidden;
            padding-bottom: 90px;
        }

        /* Glassmorphism Player Container */
        .glass-player-box {
            width: 92%;
            max-width: 390px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            padding: 22px 20px 18px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 10;
        }

        /* Top Row Info */
        .track-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, color 0.2s;
            outline: none;
            padding: 6px;
            border-radius: 50%;
        }

        .icon-btn:active {
            transform: scale(0.85);
            background: rgba(255, 255, 255, 0.2);
        }

        .icon-btn.active {
            color: #22c55e !important;
            filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.8));
        }

        .song-details {
            text-align: center;
            overflow: hidden;
            padding: 0 8px;
            flex: 1;
        }

        .song-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .artist-name {
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Progress Seekbar */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-text {
            font-size: 11.5px;
            font-weight: 700;
            color: #ffffff;
            min-width: 38px;
        }

        .seekbar {
            flex: 1;
            height: 5px;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .seekbar::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        /* Control Buttons */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .play-btn-main {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .play-btn-main:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }

        .play-btn-main svg {
            fill: #ffffff;
        }

        /* Playlist Modal */
        .playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .playlist-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .playlist-box {
            width: 90%;
            max-width: 380px;
            height: 70vh;
            background: rgba(18, 22, 32, 0.95);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
        }

        .playlist-header h3 {
            font-size: 16px;
            color: #ffffff;
        }

        .playlist-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .playlist-item {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .playlist-item.active {
            background: rgba(34, 197, 94, 0.25);
            border: 1px solid #22c55e;
        }

        .item-title { font-size: 13px; font-weight: 700; color: #ffffff; }
        .item-artist { font-size: 11px; color: rgba(255, 255, 255, 0.7); }
    </style>
</head>
<body>

    <div class="glass-player-box">
        <div class="track-info-row">
            <button class="icon-btn" id="btn-heart" onclick="toggleHeart()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>

            <div class="song-details">
                <div class="song-title" id="song-title">Song Name</div>
                <div class="artist-name" id="artist-name">Artist Name</div>
            </div>

            <button class="icon-btn" onclick="openPlaylistModal()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
        </div>

        <div class="progress-container">
            <span class="time-text" id="curr-time">00:00</span>
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
            <span class="time-text" id="dur-time" style="text-align: right;">00:00</span>
        </div>

        <div class="controls-row">
            <button class="icon-btn" onclick="skipTime(-10)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 2v6h6"></path><path d="M2.66 15.57a10 10 0 1 0 .57-8.38L2.5 8"></path><text x="8.5" y="15" font-size="7" fill="#ffffff" font-weight="bold">10</text></svg>
            </button>

            <button class="icon-btn" id="btn-shuffle" onclick="toggleShuffle()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>

            <button class="icon-btn" onclick="prevTrack()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line></svg>
            </button>

            <button class="play-btn-main" id="play-btn" onclick="togglePlay()">
                <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24"><polygon points="7,5 19,12 7,19"></polygon></svg>
            </button>

            <button class="icon-btn" onclick="nextTrack()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line></svg>
            </button>

            <button class="icon-btn" id="btn-repeat" onclick="toggleRepeat()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>

            <button class="icon-btn" onclick="skipTime(10)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"></path><path d="M21.34 15.57a10 10 0 1 1-.57-8.38L21.5 8"></path><text x="8.5" y="15" font-size="7" fill="#ffffff" font-weight="bold">10</text></svg>
            </button>
        </div>
    </div>

    <!-- Playlist Popup -->
    <div class="playlist-modal" id="playlistModal" onclick="closePlaylistOnOutside(event)">
        <div class="playlist-box">
            <div class="playlist-header">
                <h3>Playlist (90s Hits)</h3>
                <button class="icon-btn" onclick="closePlaylistModal()">✕</button>
            </div>
            <div class="playlist-list" id="playlistItemsContainer"></div>
        </div>
    </div>

    <script>
        // High-speed Direct MP3 Stream Links
        const songsList = [
            { 
                title: "Tujhe Dekha Toh", 
                artist: "Kumar Sanu, Lata Mangeshkar", 
                url: "https://youtu.be/cNV5hLSa9H8?si=MtFRN_1v4ve0pGBd" 
            },
            { 
                title: "Pehla Nasha", 
                artist: "Udit Narayan, Sadhana Sargam", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" 
            },
            { 
                title: "Chura Ke Dil Mera", 
                artist: "Kumar Sanu, Alka Yagnik", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" 
            },
            { 
                title: "Mera Dil Bhi Kitna Pagal Hai", 
                artist: "Kumar Sanu, Alka Yagnik", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" 
            },
            { 
                title: "Dheere Dheere Se", 
                artist: "Kumar Sanu", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" 
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let isHeart = false;

        const audio = new Audio();

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateUI() {
            const song = songsList[currentIndex];
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('artist-name').innerText = song.artist;
            renderPlaylist();
        }

        function loadSong(index) {
            currentIndex = index;
            updateUI();
            audio.src = songsList[currentIndex].url;
            audio.play().then(() => {
                isPlaying = true;
                updatePlayUI(true);
            }).catch(err => {
                console.warn("Auto-play blocked or link error, skipping...", err);
                nextTrack();
            });
        }

        function togglePlay() {
            if (!audio.src) {
                loadSong(currentIndex);
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                updatePlayUI(false);
            } else {
                audio.play();
                isPlaying = true;
                updatePlayUI(true);
            }
        }

        function updatePlayUI(playing) {
            const playIcon = document.getElementById('play-icon');
            if (playing) {
                playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>';
            } else {
                playIcon.innerHTML = '<polygon points="7,5 19,12 7,19"></polygon>';
            }
        }

        function nextTrack() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * songsList.length);
            } else {
                currentIndex = (currentIndex + 1) % songsList.length;
            }
            loadSong(currentIndex);
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + songsList.length) % songsList.length;
            loadSong(currentIndex);
        }

        function skipTime(seconds) {
            audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), audio.duration || 0);
        }

        function seekAudio(val) {
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('btn-shuffle').classList.toggle('active', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('btn-repeat').classList.toggle('active', isRepeat);
        }

        function toggleHeart() {
            isHeart = !isHeart;
            document.getElementById('btn-heart').classList.toggle('active', isHeart);
        }

        /* HTML5 Audio Events */
        audio.ontimeupdate = () => {
            if (audio.duration) {
                document.getElementById('seekbar').value = (audio.currentTime / audio.duration) * 100;
                document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
                document.getElementById('dur-time').innerText = formatTime(audio.duration);
            }
        };

        audio.onended = () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        };

        // AUTO-SKIP ON ERROR
        audio.onerror = () => {
            console.log("Audio link broken. Skipping to next song...");
            nextTrack();
        };

        /* Playlist Controls */
        function openPlaylistModal() {
            renderPlaylist();
            document.getElementById('playlistModal').classList.add('open');
        }

        function closePlaylistModal() {
            document.getElementById('playlistModal').classList.remove('open');
        }

        function closePlaylistOnOutside(e) {
            if (e.target.id === 'playlistModal') closePlaylistModal();
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistItemsContainer');
            if (!container) return;
            container.innerHTML = '';

            songsList.forEach((song, idx) => {
                const isCurrent = idx === currentIndex;
                const div = document.createElement('div');
                div.className = `playlist-item ${isCurrent ? 'active' : ''}`;
                div.innerHTML = `
                    <div>
                        <div class="item-title">${idx + 1}. ${song.title}</div>
                        <div class="item-artist">${song.artist}</div>
                    </div>
                    <span style="font-size:12px; color: ${isCurrent ? '#22c55e' : 'rgba(255,255,255,0.6)'}">
                        ${isCurrent && isPlaying ? '❚❚' : '▶'}
                    </span>
                `;
                div.onclick = () => {
                    loadSong(idx);
                    closePlaylistModal();
                };
                container.appendChild(div);
            });
        }

        window.onload = () => {
            updateUI();
            audio.src = songsList[0].url;
        };
    </script>
</body>
</html>
