<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK STORE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
      background: #000000;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    .main-card {
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      text-align: center;
      max-width: 380px;
      width: 88%;
      margin: 20px;
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .caption {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .buy-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: #0088cc;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 136, 204, 0.4);
      transition: all 0.2s ease;
      border: none;
    }

    .buy-btn:active {
      transform: scale(0.98);
      background: #0077bb;
    }
  </style>
</head>
<body>

  <!-- Background Video Container -->
  <div class="video-container">
    <video autoplay loop muted playsinline webkit-playsinline preload="auto" id="bg-video">
      <source src="https://we0are0back0-max.github.io/video-host/product.mp4" type="video/mp4">
    </video>
  </div>

  <div class="overlay"></div>

  <!-- Store Content -->
  <div class="main-card">
    <h1 class="title">DARK STORE</h1>
    
    <p class="caption">
      <!-- AAPKA CAPTION YAHAN AAYEGA -->
    </p>

    <a href="https://t.me/Rebel_by_dark_side" target="_blank" class="buy-btn">
      BUY NOW
    </a>
  </div>

  <!-- Mobile Autoplay Force Script -->
  <script>
    const video = document.getElementById('bg-video');
    if (video) {
      video.muted = true;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // If browser restricts autoplay, play on first touch/scroll
          document.addEventListener('touchstart', () => { video.play(); }, { once: true });
          document.addEventListener('click', () => { video.play(); }, { once: true });
        });
      }
    }
  </script>

</body>
</html>
