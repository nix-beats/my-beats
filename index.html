<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Store</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 18+ Age Verification Modal Overlay */
        .age-gate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .age-gate-box {
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .age-gate-title {
            font-size: 22px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .age-gate-text {
            font-size: 15px;
            color: #111111;
            margin-bottom: 25px;
            font-family: Arial, sans-serif;
        }

        .age-btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .age-btn {
            flex: 1;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid #000000;
            transition: all 0.2s ease;
            font-family: Arial, sans-serif;
        }

        .btn-yes {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-yes:hover {
            background-color: #333333;
        }

        .btn-no {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-no:hover {
            background-color: #eeeeee;
        }

        /* Header Section */
        header {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 13px;
            color: #000000;
            font-weight: bold;
            letter-spacing: 0.5px;
            font-family: Arial, sans-serif;
        }

        /* Main Video Card Container */
        .product-card {
            border: 2px solid #000000;
            padding: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Video Box */
        .video-wrapper {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #000000;
            border: 1px solid #000000;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Caption Text (Fixed CSS) */
        .product-caption {
            display: block !important;
            font-size: 18px !important;
            font-weight: bold !important;
            color: #000000 !important;
            margin: 20px 0 !important;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }

        /* Full Width Black Buy Button (Fixed CSS) */
        a.buy-btn, 
        a.buy-btn:visited, 
        a.buy-btn:link {
            display: block !important;
            width: 100% !important;
            background-color: #000000 !important;
            color: #ffffff !important;
            padding: 16px 0 !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 18px !important;
            border-radius: 6px !important;
            font-family: Arial, sans-serif !important;
            border: 2px solid #000000 !important;
            text-align: center !important;
            box-sizing: border-box !important;
        }

        a.buy-btn:hover {
            background-color: #333333 !important;
        }

        /* Footer / Description Box */
        footer {
            margin-top: 50px;
            padding: 25px 20px;
            border: 2px solid #000000;
            text-align: center;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .site-desc {
            font-size: 14px;
            color: #000000;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- 18+ Age Gate Popup Modal -->
    <div class="age-gate-overlay" id="ageGate">
        <div class="age-gate-box">
            <div class="age-gate-title">⚠️ Age Verification</div>
            <div class="age-gate-text">Are you 18 years old or older?</div>
            <div class="age-btn-container">
                <button class="age-btn btn-yes" onclick="confirmAge(true)">YES</button>
                <button class="age-btn btn-no" onclick="confirmAge(false)">NO</button>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <header>
        <div class="brand-name">DARK STORE</div>
        <div class="tagline">( The most Darkest vidios in the world 😲 )</div>
    </header>

    <!-- Main Content: Single Video Product -->
    <main>
        <div class="product-card">
            
            <!-- Video Box -->
            <div class="video-wrapper">
                <video id="myVideo" controls controlsList="nodownload" disablePictureInPicture oncontextmenu="return false;" preload="metadata">
                    <source src="product.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Product Caption Placeholder -->
            <p class="product-caption">You have Video's receive in Telegram app, ( 2000+ )Dark Web Leaked Video's / price only - 249₹</p>

            <!-- Black Buy Button (Full Width) -->
            <a href="https://t.me/Rebel_by_dark_side?text=yes%20I%20am%20ready%20for%20buy%20content%20in%20249%E2%82%B9" class="buy-btn">Buy Now</a>

        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p class="site-desc">First Download Teligram App, Massage For Buy DARK WEB Leaked Video's , Rebel✓ </p>
    </footer>

    <!-- Scripts -->
    <script>
        // Age verification handler
        function confirmAge(isAdult) {
            if (isAdult) {
                document.getElementById('ageGate').style.display = 'none';
            } else {
                alert("Access Denied! You must be 18 or older to view this site.");
                window.location.href = "https://www.google.com";
            }
        }

        // Disable Right Click / Long Press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
