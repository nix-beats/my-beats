<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Store</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Hacker Vibe Header */
        header {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #00ff41;
            display: inline-block;
        }

        .brand-name span {
            color: #008000;
        }

        /* Products Grid / Container */
        .product-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            background-color: #fafafa;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .product-img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        .product-caption {
            font-size: 16px;
            color: #333333;
            margin-bottom: 15px;
            line-height: 1.5;
            font-family: Arial, sans-serif;
        }

        .buy-btn {
            display: inline-block;
            background-color: #0066ff;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s ease-in-out;
        }

        .buy-btn:hover {
            background-color: #0044cc;
        }

        /* Footer / Site Description */
        footer {
            margin-top: 50px;
            padding: 25px 20px;
            border-top: 2px dashed #000000;
            text-align: center;
            background-color: #f4f4f4;
            border-radius: 8px;
        }

        .site-desc {
            font-size: 14px;
            color: #555555;
            line-height: 1.6;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">>_ DARK STORE<span>_</span></div>
    </header>

    <main class="product-container">

        <div class="product-card">
            <img src="product1.jpg" alt="Product 1" class="product-img">
            <p class="product-caption">.....1-caption.....</p>
            <a href="......buy-link-1......" class="buy-btn">Buy Now</a>
        </div>

        <div class="product-card">
            <img src="product2.jpg" alt="Product 2" class="product-img">
            <p class="product-caption">.....2-caption.....</p>
            <a href="......buy-link-2......" class="buy-btn">Buy Now</a>
        </div>

        <div class="product-card">
            <img src="product3.jpg" alt="Product 3" class="product-img">
            <p class="product-caption">.....3-caption.....</p>
            <a href="......buy-link-3......" class="buy-btn">Buy Now</a>
        </div>

        <div class="product-card">
            <img src="product4.jpg" alt="Product 4" class="product-img">
            <p class="product-caption">.....4-caption.....</p>
            <a href="......buy-link-4......" class="buy-btn">Buy Now</a>
        </div>

    </main>

    <footer>
        <p class="site-desc">.....site-description.....</p>
    </footer>

</body>
</html>
