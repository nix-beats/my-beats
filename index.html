<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff; 
            padding: 15px; 
            min-height: 100vh;
        }
        
        .logo { 
            text-align: center; 
            margin-bottom: 15px; 
            color: #ff2a5f; 
            font-size: 22px;
            letter-spacing: 3px; 
            font-weight: 800;
            text-transform: uppercase;
        }

        /* 2x2 Compact Grid (Upper Half) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 550px;
            margin: 0 auto;
        }

        /* Compact Card */
        .card {
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .category-title { 
            font-size: 10px; 
            text-transform: uppercase; 
            color: #ff2a5f; 
            margin-bottom: 8px; 
            font-weight: 700; 
            letter-spacing: 1px;
        }

        /* Top Row: Art, Text, Heart */
        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        
        .cd-art { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            border: 1.5px solid #ff2a5f; 
            object-fit: cover; 
            animation: rotate 10s linear infinite; 
            animation-play-state: paused; 
        }
        .cd-art.playing { animation-play-state: running; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .song-info { flex: 1; margin: 0 8px; overflow: hidden; }
        .song-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 10px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Heart Icon Button */
        .heart-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .heart-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; transition: all 0.2s; }
        .heart-btn.liked svg { fill: #ff2a5f; stroke: #ff2a5f; }

        /* Controls Row */
        .controls-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.4); 
            padding: 4px 8px; 
            border-radius: 8px; 
        }
        
        .btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .btn svg { width: 14px; height: 14px; fill: #aaa; transition: fill 0.2s; }
        .btn:hover svg { fill: #fff; }

        .play-btn { 
            background: #fff; 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
        }
        .play-btn svg { fill: #000; width: 12px; height: 12px; }
        .play-btn:hover svg { fill: #000; }
    </style>
</head>
<body>

    <div class="logo">MY-BEATS</div>

    <div class="grid-container">
        <!-- Box 1: Bollywood -->
        <div class="card" id="card-bollywood">
            <div class="category-title">Bollywood Hits</div>
            <div class="top-row">
                <img src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" class="cd-art">
                <div class="song-info">
                    <div class="song-title">Loading...</div>
                    <div class="artist-name">Bollywood</div>
                </div>
                <button class="heart-btn" onclick="toggleFav('bollywood')">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
            <div class="controls-row">
                <button class="btn" onclick="shuffleSong('bollywood')"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                <button class="btn" onclick="prevSong('bollywood')"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn play-btn" onclick="togglePlay('bollywood')"><svg viewBox="0 0 24 24" class="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="btn" onclick="nextSong('bollywood')"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <button class="btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
            </div>
        </div>

        <!-- Box 2: Hindi Sadabahar -->
        <div class="card" id="card-sadabahar">
            <div class="category-title">Hindi Sadabahar</div>
            <div class="top-row">
                <img src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" class="cd-art">
                <div class="song-info">
                    <div class="song-title">Loading...</div>
                    <div class="artist-name">Retro Evergreen</div>
                </div>
                <button class="heart-btn" onclick="toggleFav('sadabahar')">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
            <div class="controls-row">
                <button class="btn" onclick="shuffleSong('sadabahar')"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                <button class="btn" onclick="prevSong('sadabahar')"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn play-btn" onclick="togglePlay('sadabahar')"><svg viewBox="0 0 24 24" class="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="btn" onclick="nextSong('sadabahar')"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <button class="btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
            </div>
        </div>

        <!-- Box 3: 80s - 90s Songs -->
        <div class="card" id="card-retro">
            <div class="category-title">80s - 90s Classics</div>
            <div class="top-row">
                <img src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" class="cd-art">
                <div class="song-info">
                    <div class="song-title">Loading...</div>
                    <div class="artist-name">Golden Era</div>
                </div>
                <button class="heart-btn" onclick="toggleFav('retro')">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
            <div class="controls-row">
                <button class="btn" onclick="shuffleSong('retro')"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                <button class="btn" onclick="prevSong('retro')"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn play-btn" onclick="togglePlay('retro')"><svg viewBox="0 0 24 24" class="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="btn" onclick="nextSong('retro')"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <button class="btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
            </div>
        </div>

        <!-- Box 4: Favourites -->
        <div class="card" id="card-fav">
            <div class="category-title">Favourites</div>
            <div class="top-row">
                <img src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" class="cd-art">
                <div class="song-info">
                    <div class="song-title" id="fav-title">No Favorites</div>
                    <div class="artist-name" id="fav-artist">Click Heart</div>
                </div>
                <button class="heart-btn liked">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
            <div class="controls-row">
                <button class="btn" onclick="shuffleSong('fav')"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                <button class="btn" onclick="prevSong('fav')"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn play-btn" onclick="togglePlay('fav')"><svg viewBox="0 0 24 24" class="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="btn" onclick="nextSong('fav')"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <button class="btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
            </div>
        </div>
    </div>

    <audio id="global-audio"></audio>

    <script>
        const musicData = {
            bollywood: [
                { title: "Kesariya", artist: "Arijit Singh", url: "https://stream.zeno.fm/f3wvbb754wzuv" },
                { title: "Chaleya", artist: "Anirudh", url: "https://stream.zeno.fm/0883394628quv" }
            ],
            sadabahar: [
                { title: "Tere Bina Zindagi Se", artist: "Lata Mangeshkar", url: "https://stream.zeno.fm/601r2f8e138uv" },
                { title: "Pal Pal Dil Ke Paas", artist: "Kishore Kumar", url: "https://stream.zeno.fm/4g48bh2628quv" }
            ],
            retro: [
                { title: "Tamma Tamma Loge", artist: "Bappi Lahiri", url: "https://stream.zeno.fm/f3wvbb754wzuv" },
                { title: "Dil Deewana", artist: "S. P. Balasubrahmanyam", url: "https://stream.zeno.fm/601r2f8e138uv" }
            ]
        };

        const currentTracks = {};
        const audio = document.getElementById('global-audio');
        let activeCategory = null;

        window.onload = () => {
            ['bollywood', 'sadabahar', 'retro'].forEach(cat => {
                const randIndex = Math.floor(Math.random() * musicData[cat].length);
                currentTracks[cat] = { index: randIndex, ...musicData[cat][randIndex] };
                updateCardUI(cat);
            });
            loadFavUI();
        };

        function updateCardUI(cat) {
            const card = document.getElementById(`card-${cat}`);
            card.querySelector('.song-title').innerText = currentTracks[cat].title;
            card.querySelector('.artist-name').innerText = currentTracks[cat].artist;
        }

        function togglePlay(cat) {
            if (cat === 'fav') {
                const favs = JSON.parse(localStorage.getItem('myBeatsFavs') || '[]');
                if (favs.length === 0) return alert('No favorite songs added!');
                if (!currentTracks['fav']) currentTracks['fav'] = favs[0];
            }

            if (activeCategory === cat && !audio.paused) {
                audio.pause();
                setPlayIcon(cat, false);
            } else {
                if (activeCategory && activeCategory !== cat) {
                    setPlayIcon(activeCategory, false);
                }
                activeCategory = cat;
                audio.src = currentTracks[cat].url;
                audio.play();
                setPlayIcon(cat, true);
            }
        }

        function setPlayIcon(cat, isPlaying) {
            const card = document.getElementById(`card-${cat}`);
            const playSvg = card.querySelector('.play-btn');
            const cd = card.querySelector('.cd-art');
            
            if (isPlaying) {
                playSvg.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                cd.classList.add('playing');
            } else {
                playSvg.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                cd.classList.remove('playing');
            }
        }

        function shuffleSong(cat) {
            if (cat === 'fav') return;
            const randIndex = Math.floor(Math.random() * musicData[cat].length);
            currentTracks[cat] = { index: randIndex, ...musicData[cat][randIndex] };
            updateCardUI(cat);
            if (activeCategory === cat) togglePlay(cat);
        }

        function nextSong(cat) {
            if (cat === 'fav') return;
            currentTracks[cat].index = (currentTracks[cat].index + 1) % musicData[cat].length;
            const song = musicData[cat][currentTracks[cat].index];
            currentTracks[cat] = { index: currentTracks[cat].index, ...song };
            updateCardUI(cat);
            if (activeCategory === cat) togglePlay(cat);
        }

        function prevSong(cat) {
            if (cat === 'fav') return;
            currentTracks[cat].index = (currentTracks[cat].index - 1 + musicData[cat].length) % musicData[cat].length;
            const song = musicData[cat][currentTracks[cat].index];
            currentTracks[cat] = { index: currentTracks[cat].index, ...song };
            updateCardUI(cat);
            if (activeCategory === cat) togglePlay(cat);
        }

        function toggleFav(cat) {
            const song = currentTracks[cat];
            let favs = JSON.parse(localStorage.getItem('myBeatsFavs') || '[]');
            const existsIndex = favs.findIndex(s => s.title === song.title);
            const heartBtn = document.getElementById(`card-${cat}`).querySelector('.heart-btn');

            if (existsIndex > -1) {
                favs.splice(existsIndex, 1);
                heartBtn.classList.remove('liked');
            } else {
                favs.push(song);
                heartBtn.classList.add('liked');
            }

            localStorage.setItem('myBeatsFavs', JSON.stringify(favs));
            loadFavUI();
        }

        function loadFavUI() {
            const favs = JSON.parse(localStorage.getItem('myBeatsFavs') || '[]');
            if (favs.length > 0) {
                document.getElementById('fav-title').innerText = favs[0].title;
                document.getElementById('fav-artist').innerText = favs[0].artist;
                currentTracks['fav'] = favs[0];
            } else {
                document.getElementById('fav-title').innerText = "No Favorites";
                document.getElementById('fav-artist').innerText = "Click Heart";
            }
        }
    </script>
</body>
</html>
