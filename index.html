<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats Player</title>

    <script src="songs.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            padding: 10px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo { 
            font-size: 18px; 
            font-weight: 800; 
            color: #ffffff; 
            margin-top: 10px;
            margin-bottom: 15px;
            letter-spacing: 2.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            text-align: center;
        }

        /* 1. Categories Section (Top Side) */
        .category-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            padding: 10px;
        }

        .cat-title {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .cat-buttons { display: flex; gap: 6px; }

        .mood-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 6px 4px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .playlist-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        /* 2. Compact Player Card (Moved to the VERY BOTTOM) */
        .player-card {
            background: rgba(0, 0, 0, 0.55);
            border: 1.5px solid #ffffff;
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            margin-top: auto; /* Push to absolute bottom */
            margin-bottom: 10px;
        }

        .active-tag {
            font-size: 10px;
            font-weight: 800;
            color: #4cd137;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .active-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #4cd137;
            border-radius: 50%;
            display: inline-block;
        }

        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        
        .cd-art { 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            border: 1.5px solid #ffffff; 
            object-fit: cover; 
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .cd-art.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-info { flex: 1; margin: 0 10px; overflow: hidden; }
        .song-title { font-size: 13px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 11px; color: rgba(255, 255, 255, 0.8); margin-top: 1px; }

        .seekbar-row { margin: 6px 0 8px 0; }
        .seekbar {
            width: 100%;
            height: 3px;
            accent-color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Live Timer Display */
        .time-box {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            margin-top: 3px;
        }

        .controls-row { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px; 
            border-radius: 10px; 
        }
        
        .btn { background: none; border: none; cursor: pointer; color: #ffffff; font-size: 16px; }
        .play-btn { 
            background: #ffffff; 
            color: #000000;
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 12px;
        }

        /* Popup Playlist Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: #181818;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            width: 100%;
            max-width: 350px;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .modal-title { font-size: 13px; font-weight: 800; color: #fff; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

        .search-box {
            width: 100%;
            padding: 8px;
            background: #282828;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            outline: none;
            margin-bottom: 8px;
        }

        .playlist-items { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .song-item { padding: 6px 8px; background: #222; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-size: 12px; font-weight: 700; color: #fff; }
        .item-artist { font-size: 10px; color: #aaa; }

        #yt-player-container { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div class="logo">MY-BEATS</div>

    <!-- 1. Category Buttons Section -->
    <div class="category-container">
        
        <div class="category-box">
            <div class="cat-title">1. 90's POP</div>
            <div class="cat-buttons">
                <button class="mood-btn" onclick="setPlaylist('nineties_romantic', '90s Pop - Romantic')">❤️ Romantic</button>
                <button class="mood-btn" onclick="setPlaylist('nineties_sad', '90s Pop - Sad')">💔 Sad</button>
                <button class="playlist-btn" onclick="openPlaylistModal('nineties', '90s Pop')">📜 Playlist</button>
            </div>
        </div>

        <div class="category-box">
            <div class="cat-title">2. BOLLYWOOD POP</div>
            <div class="cat-buttons">
                <button class="mood-btn" onclick="setPlaylist('bollywood_romantic', 'Bollywood Pop - Romantic')">❤️ Romantic</button>
                <button class="mood-btn" onclick="setPlaylist('bollywood_sad', 'Bollywood Pop - Sad')">💔 Sad</button>
                <button class="playlist-btn" onclick="openPlaylistModal('bollywood', 'Bollywood Pop')">📜 Playlist</button>
            </div>
        </div>

        <div class="category-box">
            <div class="cat-title">3. SADA BAHAR (RETRO)</div>
            <div class="cat-buttons">
                <button class="mood-btn" onclick="setPlaylist('sadabahar_romantic', 'Sada Bahar - Romantic')">❤️ Romantic</button>
                <button class="mood-btn" onclick="setPlaylist('sadabahar_sad', 'Sada Bahar - Sad')">💔 Sad</button>
                <button class="playlist-btn" onclick="openPlaylistModal('sadabahar', 'Sada Bahar')">📜 Playlist</button>
            </div>
        </div>

        <div class="category-box">
            <div class="cat-title">4. PUNJABI (LONG DRIVE)</div>
            <div class="cat-buttons">
                <button class="mood-btn" onclick="setPlaylist('punjabi_romantic', 'Punjabi - Romantic')">❤️ Romantic</button>
                <button class="mood-btn" onclick="setPlaylist('punjabi_sad', 'Punjabi - Sad')">💔 Sad</button>
                <button class="playlist-btn" onclick="openPlaylistModal('punjabi', 'Punjabi Long Drive')">📜 Playlist</button>
            </div>
        </div>

    </div>

    <!-- 2. Player Card Box (Now at the VERY BOTTOM) -->
    <div class="player-card">
        <div class="active-tag" id="active-category-name">BOLLYWOOD POP - ROMANTIC</div>
        <div class="top-row">
            <img src="cd.jpg" class="cd-art" id="cd-art" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg'">
            <div class="song-info">
                <div class="song-title" id="song-title">Select a Song</div>
                <div class="artist-name" id="artist-name">---</div>
            </div>
        </div>
        <div class="seekbar-row">
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
            <div class="time-box">
                <span id="curr-time">0:00</span>
                <span id="dur-time">0:00</span>
            </div>
        </div>
        <div class="controls-row">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <!-- Modal Playlist Window -->
    <div class="modal" id="playlistModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalCategoryTitle">PLAYLIST</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="Search song..." oninput="filterSongs()">
            <div class="playlist-items" id="playlistList"></div>
        </div>
    </div>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        let currentPlaylistKey = 'bollywood_romantic';
        let currentList = [];
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;
        let isEngineReady = false;
        let modalActiveKey = '';

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function loadList(key) {
            if (window.musicData && window.musicData[key]) {
                return window.musicData[key].filter(song => song.id !== "...id..." && song.id !== "");
            }
            return [];
        }

        function setPlaylist(key, titleName) {
            currentPlaylistKey = key;
            currentList = loadList(key);
            currentIndex = 0;
            document.getElementById('active-category-name').innerText = titleName;
            
            if (currentList.length > 0) {
                updateUI();
                if (isPlaying) playCurrentSong();
            } else {
                document.getElementById('song-title').innerText = "No Songs Added";
                document.getElementById('artist-name').innerText = "Fill 'songs.js'";
                document.getElementById('curr-time').innerText = "0:00";
                document.getElementById('dur-time').innerText = "0:00";
            }
        }

        function updateUI() {
            if (currentList.length > 0) {
                const song = currentList[currentIndex];
                document.getElementById('song-title').innerText = song.title;
                document.getElementById('artist-name').innerText = song.artist;
            }
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100', width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onReady': () => { isEngineReady = true; },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                            document.getElementById('cd-art').classList.add('playing');
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            document.getElementById('cd-art').classList.remove('playing');
                        } else if (e.data === YT.PlayerState.ENDED) {
                            nextSong();
                        }
                    }
                }
            });
        }

        function playCurrentSong() {
            if (currentList.length === 0) return;
            const song = currentList[currentIndex];
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(song.id);
                ytPlayer.playVideo();
            }
        }

        function togglePlay() {
            if (!isEngineReady || !ytPlayer) return;
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { playCurrentSong(); }
        }

        function nextSong() {
            if (currentList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentList.length;
            updateUI();
            if (isPlaying) playCurrentSong();
        }

        function prevSong() {
            if (currentList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
            updateUI();
            if (isPlaying) playCurrentSong();
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        function openPlaylistModal(categoryPrefix, title) {
            modalActiveKey = categoryPrefix;
            document.getElementById('modalCategoryTitle').innerText = title + " Playlist";
            document.getElementById('searchInput').value = '';
            document.getElementById('playlistModal').style.display = 'flex';
            filterSongs();
        }

        function closeModal() {
            document.getElementById('playlistModal').style.display = 'none';
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('playlistList');
            container.innerHTML = '';

            const romList = window.musicData[modalActiveKey + '_romantic'] || [];
            const sadList = window.musicData[modalActiveKey + '_sad'] || [];
            const combined = [
                ...romList.map(s => ({...s, key: modalActiveKey + '_romantic', tag: 'Romantic'})),
                ...sadList.map(s => ({...s, key: modalActiveKey + '_sad', tag: 'Sad'}))
            ].filter(s => s.id !== "...id..." && s.id !== "");

            const filtered = combined.filter(song => 
                song.title.toLowerCase().includes(query) || 
                song.artist.toLowerCase().includes(query)
            );

            if(filtered.length === 0) {
                container.innerHTML = '<div style="color:#aaa; text-align:center; padding:10px; font-size:11px;">No songs found</div>';
                return;
            }

            filtered.forEach((song) => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                    <div>
                        <div class="item-name">${song.title}</div>
                        <div class="item-artist">${song.artist} • [${song.tag}]</div>
                    </div>
                    <span style="font-size:10px; color:#4cd137;">▶ Play</span>
                `;
                div.onclick = () => {
                    currentPlaylistKey = song.key;
                    currentList = loadList(song.key);
                    currentIndex = currentList.findIndex(s => s.id === song.id);
                    document.getElementById('active-category-name').innerText = song.tag + " - " + song.title;
                    updateUI();
                    playCurrentSong();
                    closeModal();
                };
                container.appendChild(div);
            });
        }

        /* Timer Update Interval */
        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                    document.getElementById('curr-time').innerText = formatTime(cur);
                    document.getElementById('dur-time').innerText = formatTime(dur);
                }
            }
        }, 500);

        window.onload = function() {
            setPlaylist('bollywood_romantic', 'BOLLYWOOD POP - ROMANTIC');
        };
    </script>
</body>
</html>
