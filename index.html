<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neumorphic Music Player</title>

    <script src="songs.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Neumorphic / Soft Elevation Theme Colors */
        :root[data-theme="dark"] {
            --bg: #131722;
            --card-bg: #1a1f2c;
            --text-main: #ffffff;
            --text-sub: #8a96a8;
            --shadow-outer: 10px 10px 20px #0c0e16, -10px -10px 20px #1a202e;
            --glow: 0px 15px 35px rgba(255, 255, 255, 0.15);
            --pill-bg: #212738;
            --accent-btn: #ffffff;
            --accent-text: #000000;
            --border-line: rgba(255, 255, 255, 0.08);
        }

        :root[data-theme="light"] {
            --bg: #eef2f5;
            --card-bg: #ffffff;
            --text-main: #19202d;
            --text-sub: #7e8b9b;
            --shadow-outer: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
            --glow: 0px 15px 30px rgba(0, 0, 0, 0.12);
            --pill-bg: #e6ecf1;
            --accent-btn: #19202d;
            --accent-text: #ffffff;
            --border-line: rgba(0, 0, 0, 0.06);
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .app-frame {
            max-width: 420px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg);
        }

        /* Views management */
        .view-screen {
            display: none;
            flex-direction: column;
            height: calc(100vh - 70px);
            padding: 16px;
            overflow: hidden;
        }
        .view-screen.active { display: flex; }

        /* HEADER */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0 12px 0;
        }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
        }

        /* 1. LIBRARY VIEW (Right Screen layout) */
        .album-header-card {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
        }

        .album-art-thumb {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: var(--glow);
        }

        .album-info-meta { display: flex; flex-direction: column; gap: 4px; }
        .album-tag { font-size: 11px; color: var(--text-sub); }
        .album-title { font-size: 22px; font-weight: 800; color: var(--text-main); }
        .album-artist { font-size: 12px; color: var(--text-sub); }

        .album-action-pills {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .action-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            background: var(--pill-bg);
            color: var(--text-main);
            border: 1px solid var(--border-line);
        }

        /* PLAY / SHUFFLE BUTTONS ROW */
        .action-buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .btn-play-large {
            flex: 1;
            background: var(--accent-btn);
            color: var(--accent-text);
            border: none;
            padding: 12px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--glow);
            cursor: pointer;
        }
        .btn-shuffle-large {
            flex: 1;
            background: var(--pill-bg);
            color: var(--text-main);
            border: 1px solid var(--border-line);
            padding: 12px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        /* SONG LIST (Scrollable area) */
        .song-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            padding-bottom: 70px;
        }
        .song-list-scroll::-webkit-scrollbar { display: none; }

        .track-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 14px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .track-row.active-track {
            background: var(--card-bg);
            box-shadow: var(--shadow-outer);
        }

        .track-left-group { display: flex; align-items: center; gap: 14px; overflow: hidden; }
        .track-index { font-size: 13px; font-weight: 700; color: var(--text-sub); width: 18px; }
        .track-details { overflow: hidden; }
        .track-name-str { font-size: 14px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist-str { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .dots-btn { color: var(--text-sub); font-size: 14px; }

        /* FLOATING MINI PLAYER (Above bottom nav) */
        .floating-mini-player {
            position: absolute;
            bottom: 72px;
            left: 16px;
            right: 16px;
            background: var(--accent-btn);
            color: var(--accent-text);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--glow);
            cursor: pointer;
            z-index: 10;
        }
        .mini-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .mini-art { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; }
        .mini-meta { overflow: hidden; }
        .mini-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-sub { font-size: 10px; opacity: 0.7; }
        .mini-right { display: flex; align-items: center; gap: 12px; }

        /* 2. NOW PLAYING VIEW (Left Screen Layout) */
        .now-playing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 10px 0 20px 0;
        }

        .big-album-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px 0;
        }
        .big-album-art {
            width: 100%;
            height: 100%;
            border-radius: 28px;
            object-fit: cover;
            box-shadow: var(--glow);
        }

        .now-song-meta { text-align: center; width: 100%; }
        .now-song-title { font-size: 20px; font-weight: 800; color: var(--text-main); }
        .now-artist-name { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        /* Waveform / Seekbar styling */
        .waveform-box {
            width: 100%;
            margin: 15px 0 5px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .wave-bars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 30px;
        }
        .wave-bar {
            width: 3px;
            background: var(--text-sub);
            border-radius: 3px;
            opacity: 0.4;
            transition: height 0.2s;
        }
        .wave-bar.active { background: var(--text-main); opacity: 1; }

        .time-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); font-weight: 600; }
        .seek-slider { width: 100%; accent-color: var(--text-main); cursor: pointer; }

        /* Full Controls Row */
        .player-controls-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 10px;
        }
        .ctrl-icon { font-size: 18px; color: var(--text-sub); cursor: pointer; }
        .big-play-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--accent-btn);
            color: var(--accent-text);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--glow);
            cursor: pointer;
        }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: var(--bg);
            border-top: 1px solid var(--border-line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-sub);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: none;
        }
        .nav-item.active { color: var(--text-main); }
        .nav-icon { font-size: 16px; }

        /* Search Bar Input */
        .search-input-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--pill-bg);
            border: 1px solid var(--border-line);
            color: var(--text-main);
            outline: none;
            margin-bottom: 12px;
            font-size: 13px;
        }

        #yt-player-container { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div class="app-frame">
        
        <!-- 1. LIBRARY VIEW SCREEN (Right Screen in UI Image) -->
        <div class="view-screen active" id="libraryView">
            <div class="top-header">
                <button class="icon-btn">❮</button>
                <button class="icon-btn" onclick="toggleTheme()" title="Switch Dark/Light Theme">☀️/🌙</button>
            </div>

            <input type="text" class="search-input-box" id="searchInput" placeholder="Search songs..." oninput="renderSongList()">

            <!-- Album Card Header -->
            <div class="album-header-card">
                <img src="cd.jpg" class="album-art-thumb" id="lib-album-art" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg'">
                <div class="album-info-meta">
                    <span class="album-tag">Album • 17 songs</span>
                    <h2 class="album-title" id="lib-album-title">My Playlist</h2>
                    <span class="album-artist">Featured Artists</span>
                    <div class="album-action-pills">
                        <span class="action-pill">🎵 HQ</span>
                        <span class="action-pill">⬇ Offline</span>
                        <span class="action-pill">•••</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons-row">
                <button class="btn-play-large" onclick="playSelectedTrack(0)">▶ Play</button>
                <button class="btn-shuffle-large" onclick="shufflePlay()">🔀 Shuffle</button>
            </div>

            <!-- Scrollable Track List -->
            <div class="song-list-scroll" id="songListContainer"></div>

            <!-- Floating Mini Player -->
            <div class="floating-mini-player" onclick="switchView('nowPlayingView')">
                <div class="mini-left">
                    <img src="cd.jpg" class="mini-art" id="mini-art" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg'">
                    <div class="mini-meta">
                        <div class="mini-title" id="mini-title">Select Song</div>
                        <div class="mini-sub" id="mini-artist">Artist</div>
                    </div>
                </div>
                <div class="mini-right">
                    <span style="font-size: 14px;">♡</span>
                    <button class="icon-btn" style="color: inherit; font-size: 16px;" onclick="event.stopPropagation(); togglePlay();" id="mini-play-btn">▶</button>
                </div>
            </div>
        </div>

        <!-- 2. NOW PLAYING VIEW SCREEN (Left Screen in UI Image) -->
        <div class="view-screen" id="nowPlayingView">
            <div class="top-header">
                <button class="icon-btn" onclick="switchView('libraryView')">❮</button>
                <span style="font-size: 13px; font-weight: 700;">Now Playing</span>
                <button class="icon-btn">≡</button>
            </div>

            <div class="now-playing-container">
                <!-- Glowing Big Album Art -->
                <div class="big-album-wrapper">
                    <img src="cd.jpg" class="big-album-art" id="now-art" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg'">
                </div>

                <div class="now-song-meta">
                    <h2 class="now-song-title" id="now-title">Unstable</h2>
                    <p class="now-artist-name" id="now-artist">Mr. Kitty</p>
                </div>

                <!-- Waveform / Seekbar Box -->
                <div class="waveform-box">
                    <div class="wave-bars" id="waveBars"></div>
                    <input type="range" class="seek-slider" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
                    <div class="time-labels">
                        <span id="curr-time">1:04</span>
                        <span id="dur-time">2:52</span>
                    </div>
                </div>

                <!-- Full Controls Row -->
                <div class="player-controls-main">
                    <span class="ctrl-icon">🔀</span>
                    <span class="ctrl-icon" onclick="prevSong()">⏮</span>
                    <button class="big-play-btn" id="now-play-btn" onclick="togglePlay()">▶</button>
                    <span class="ctrl-icon" onclick="nextSong()">⏭</span>
                    <span class="ctrl-icon">🔁</span>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="bottom-nav">
            <button class="nav-item" onclick="switchView('libraryView')">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </button>
            <button class="nav-item" onclick="document.getElementById('searchInput').focus(); switchView('libraryView');">
                <span class="nav-icon">🔍</span>
                <span>Search</span>
            </button>
            <button class="nav-item active" onclick="switchView('libraryView')">
                <span class="nav-icon">🎵</span>
                <span>Library</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🔥</span>
                <span>Hotlist</span>
            </button>
        </div>

    </div>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        let songList = [];
        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;
        let isEngineReady = false;

        // Theme Toggle (Dark / Light)
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        // View Switching
        function switchView(viewId) {
            document.querySelectorAll('.view-screen').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // Generate Waveform Bars Visualizer
        function buildWaveform() {
            const container = document.getElementById('waveBars');
            container.innerHTML = '';
            for (let i = 0; i < 35; i++) {
                const bar = document.createElement('div');
                bar.className = 'wave-bar' + (i < 12 ? ' active' : '');
                bar.style.height = Math.floor(Math.random() * 22 + 6) + 'px';
                container.appendChild(bar);
            }
        }

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function loadSongsFromData() {
            songList = [];
            if (!window.musicData) return;
            for (let key in window.musicData) {
                const items = window.musicData[key].filter(s => s.id && s.id !== "...id...");
                songList.push(...items);
            }
        }

        function renderSongList() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('songListContainer');
            container.innerHTML = '';

            const filtered = songList.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.artist.toLowerCase().includes(query)
            );

            filtered.forEach((song, idx) => {
                const isActive = currentIndex === idx && isPlaying;
                const div = document.createElement('div');
                div.className = `track-row ${isActive ? 'active-track' : ''}`;
                div.innerHTML = `
                    <div class="track-left-group">
                        <span class="track-index">${(idx + 1).toString().padStart(2, '0')}</span>
                        <div class="track-details">
                            <div class="track-name-str">${song.title}</div>
                            <div class="track-artist-str">${song.artist}</div>
                        </div>
                    </div>
                    <span class="dots-btn">•••</span>
                `;
                div.onclick = () => playSelectedTrack(idx);
                container.appendChild(div);
            });
        }

        function playSelectedTrack(idx) {
            if (songList.length === 0) return;
            currentIndex = idx;
            const song = songList[currentIndex];

            document.getElementById('mini-title').innerText = song.title;
            document.getElementById('mini-artist').innerText = song.artist;
            document.getElementById('now-title').innerText = song.title;
            document.getElementById('now-artist').innerText = song.artist;

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(song.id);
                ytPlayer.playVideo();
            }
            renderSongList();
        }

        function shufflePlay() {
            if (songList.length === 0) return;
            const rand = Math.floor(Math.random() * songList.length);
            playSelectedTrack(rand);
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100', width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onReady': () => { isEngineReady = true; },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('mini-play-btn').innerText = '❚❚';
                            document.getElementById('now-play-btn').innerText = '❚❚';
                            renderSongList();
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            document.getElementById('mini-play-btn').innerText = '▶';
                            document.getElementById('now-play-btn').innerText = '▶';
                            renderSongList();
                        } else if (e.data === YT.PlayerState.ENDED) {
                            nextSong();
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if (!isEngineReady || !ytPlayer) return;
            if (isPlaying) { ytPlayer.pauseVideo(); } 
            else { ytPlayer.playVideo(); }
        }

        function nextSong() {
            if (songList.length === 0) return;
            currentIndex = (currentIndex + 1) % songList.length;
            playSelectedTrack(currentIndex);
        }

        function prevSong() {
            if (songList.length === 0) return;
            currentIndex = (currentIndex - 1 + songList.length) % songList.length;
            playSelectedTrack(currentIndex);
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                    document.getElementById('curr-time').innerText = formatTime(cur);
                    document.getElementById('dur-time').innerText = formatTime(dur);
                }
            }
        }, 500);

        window.onload = function() {
            buildWaveform();
            loadSongsFromData();
            renderSongList();
        };
    </script>
</body>
</html>
