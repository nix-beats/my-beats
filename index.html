<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Beats Test</title>

    <!-- YouTube Engine API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #121212;
            color: #fff; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .logo { 
            font-size: 26px; 
            font-weight: 900; 
            color: #ff2a5f; 
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            max-width: 330px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .category-title { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #ff2a5f; 
            margin-bottom: 10px; 
            font-weight: 800; 
        }

        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        
        .cd-art { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            border: 2px solid #ff2a5f; 
            object-fit: cover; 
        }

        .song-info { flex: 1; margin: 0 12px; overflow: hidden; }
        .song-title { font-size: 15px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 12px; color: #aaa; }

        .seekbar-row { margin: 12px 0; }
        .seekbar {
            width: 100%;
            height: 4px;
            accent-color: #ff2a5f;
            cursor: pointer;
        }

        .controls-row { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: rgba(0,0,0,0.4); 
            padding: 8px; 
            border-radius: 12px; 
        }
        
        .btn { background: none; border: none; cursor: pointer; color: #fff; font-size: 18px; }
        .play-btn { 
            background: #ffffff; 
            color: #000;
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 16px;
        }

        #yt-player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="logo">MY-BEATS</div>

    <!-- YouTube Engine Element -->
    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Single Test Card -->
    <div class="card">
        <div class="category-title">Bollywood Hits</div>
        <div class="top-row">
            <img src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" class="cd-art">
            <div class="song-info">
                <div class="song-title" id="song-title">---</div>
                <div class="artist-name" id="artist-name">---</div>
            </div>
        </div>
        <div class="seekbar-row">
            <input type="range" class="seekbar" id="seekbar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
        </div>
        <div class="controls-row">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <script>
        // Single Simple Songs Array
        const songs = [
            { id: "6mr4cYJ7yew", title: "Kesariya", artist: "Arijit Singh" },
            { id: "VAdGW7QDJiU", title: "Chaleya", artist: "Anirudh Ravichander" },
            { id: "UEvOsQBu1jY", title: "Apna Bana Le", artist: "Arijit Singh" }
        ];

        let currentIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;

        // Immediately update text on screen
        function updateUI() {
            const song = songs[currentIndex];
            document.getElementById('song-title').innerText = song.title;
            document.getElementById('artist-name').innerText = song.artist;
        }

        // Init YouTube Engine
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-btn').innerText = '❚❚';
                        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                            isPlaying = false;
                            document.getElementById('play-btn').innerText = '▶';
                            if (event.data === YT.PlayerState.ENDED) nextSong();
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if (!ytPlayer) return alert("Player loading, please wait...");
            const song = songs[currentIndex];
            
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                if (ytPlayer.getVideoData && ytPlayer.getVideoData().video_id === song.id) {
                    ytPlayer.playVideo();
                } else {
                    ytPlayer.loadVideoById(song.id);
                }
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            updateUI();
            if (ytPlayer) ytPlayer.loadVideoById(songs[currentIndex].id);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            updateUI();
            if (ytPlayer) ytPlayer.loadVideoById(songs[currentIndex].id);
        }

        function seekAudio(val) {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) ytPlayer.seekTo((val / 100) * dur, true);
            }
        }

        // Sync Seekbar Progress
        setInterval(() => {
            if (ytPlayer && isPlaying && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                const cur = ytPlayer.getCurrentTime();
                if (dur > 0) {
                    document.getElementById('seekbar').value = (cur / dur) * 100;
                }
            }
        }, 500);

        // Run UI update IMMEDIATELY
        updateUI();
    </script>
</body>
</html>
